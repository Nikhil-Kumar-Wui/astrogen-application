kind = "web"
previewPath = "/"
title = "AstroGen"
version = "1.0.0"
id = "artifacts/astrogen"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20318

[services.development]
run = "pnpm --filter @workspace/astrogen run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/astrogen", "run", "build" ]
publicDir = "artifacts/astrogen/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20318"
BASE_PATH = "/"
